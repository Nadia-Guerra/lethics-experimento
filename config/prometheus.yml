# Prometheus configuration for Lethics benchmark (EXP-RF-18)
global:
  scrape_interval: 1s          # Resolución de 1 segundo (§7)
  evaluation_interval: 1s

scrape_configs:
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

